---
name: Test super-linter basic usage (markdown)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_LOCAL: "true"
          VALIDATE_MARKDOWN: "true"
          FILTER_REGEX_INCLUDE: ".*tests/fixtures/markdown/.*"
          LOG_LEVEL: WARN
          VALIDATE_ALL_CODEBASE: "true"
        continue-on-error: true

      - name: Assert linter ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran and exited (may have found issues or hit infrastructure limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
